# Unit, acceptance and e2e tests (real pgs containers) on pull requests and on pushes to main.
# Pushes to other branches are covered by their pull request, so nothing runs twice.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2 # installs the versions pinned in mise.toml
        with:
          install_args: go just opentofu
      - run: just lint
      - run: just test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: go just opentofu
      - run: just e2e-all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: test/e2e/.logs/
          include-hidden-files: true # .logs is a hidden directory, skipped by default

  # Publishes the SBOM of main to Dependency Track once the tests pass.
  # Required repository secret: DEPENDENCY_TRACK_API_KEY (team key with BOM_UPLOAD and PROJECT_CREATION_UPLOAD).
  sbom:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: go
      - name: Generate CycloneDX SBOM
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 mod -licenses -json -output bom.json
      - name: Upload SBOM to Dependency Track
        env:
          DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://dependencytrack.innoq.io/api/v1/bom" \
            -H "X-Api-Key: ${DT_API_KEY}" \
            -F "autoCreate=true" \
            -F "projectName=terraform-provider-pgs" \
            -F "projectVersion=main" \
            -F "isLatest=true" \
            -F "bom=@bom.json"
