# Publishes a release when a version tag (v1.2.3) is pushed. The registries pick up the signed GitHub release.
# Required repository secrets: GPG_PRIVATE_KEY (ASCII-armored), PASSPHRASE and DEPENDENCY_TRACK_API_KEY.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # installs the versions pinned in mise.toml
        with:
          install_args: go just opentofu
      - run: just lint
      - run: just test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go just opentofu
      - run: just e2e-all
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: test/e2e/.logs/
          include-hidden-files: true # .logs is a hidden directory, skipped by default

  goreleaser:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@v5 # `just`, used by the goreleaser before-hook that builds the SSH helpers
        with:
          install_args: just
      - uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  # Publishes the SBOM of the tagged version to Dependency Track.
  sbom:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go
      - name: Generate CycloneDX SBOM
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 mod -licenses -json -output bom.json
      - name: Upload SBOM to Dependency Track
        env:
          DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://dependencytrack.innoq.io/api/v1/bom" \
            -H "X-Api-Key: ${DT_API_KEY}" \
            -F "autoCreate=true" \
            -F "projectName=terraform-provider-pgs" \
            -F "projectVersion=${VERSION}" \
            -F "isLatest=true" \
            -F "parentUUID=62f7a18e-db77-4393-8611-3360e2e0f742" \
            -F "bom=@bom.json"
